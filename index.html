<section style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 14px; font-size: 17px; line-height: 1.6; text-align: center">
<p style="margin: 0">Subradar is a booking agency for artists who work below the surface.</p>
<p style="margin: 0; color: #B3AB97">First signal soon.<span id="sr-invite"> Leave your address to receive it.</span></p>
</div>
<div id="sr-sent" role="status" hidden style="border-top: 1px solid #3A352C; padding-top: 28px; font-size: 13px; letter-spacing: 0.22em">YOU ARE ON THE FREQUENCY.</div>
<form id="sr-form" novalidate style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; border-top: 1px solid #3A352C; padding-top: 28px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px">
<label for="sr-email" style="font-size: 11px; letter-spacing: 0.3em; color: #B3AB97">EMAIL</label>
<input id="sr-email" name="email" type="email" required="" autocomplete="email" style="background: transparent; border: none; border-bottom: 1px solid #3A352C; color: #F3E9C6; font-family: inherit; font-size: 16px; padding: 10px 0; min-height: 44px; box-sizing: border-box">
</div>
<button type="submit" style="min-height: 44px; padding: 0 22px; background: transparent; color: #F3E9C6; border: 1px solid #F3E9C6; font-family: inherit; font-size: 12px; letter-spacing: 0.32em; cursor: pointer">TUNE IN</button>
</form>
</section>
</main>
<footer style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 24px 32px; font-size: 11px; letter-spacing: 0.3em; color: #B3AB97">
<div>BERLIN</div>
<div>BELOW THE SURFACE</div>
</footer>
</div>
<script>
// Where sign-ups are sent. Set this to your form endpoint, see README.md.
const FORM_ENDPOINT = "";
const form = document.getElementById("sr-form");
const sent = document.getElementById("sr-sent");
// Until an endpoint is set, the sign-up form stays hidden so no address gets lost.
if (!FORM_ENDPOINT) { form.hidden = true; document.getElementById("sr-invite").hidden = true; }
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = form.elements.email;
  if (!email.checkValidity()) { email.reportValidity(); return; }
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    {
      const res = await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ email: email.value, _subject: "Subradar: new sign-up" })
      });
      if (!res.ok) throw new Error("send failed");
    }
    form.hidden = true;
    sent.hidden = false;
  } catch (err) {
    button.disabled = false;
    button.textContent = "TRY AGAIN";
  }
});
</script>
